name: Modal focus diagnostics
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  webkit-focus:
    name: WebKit modal focus diagnostic repeats (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: node tests/browser/focus-diagnostic.mjs webkit
      - name: Retain bounded synthetic focus timelines
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: webkit-modal-focus-diagnostic
          path: test-results/upgrade023-independent/webkit-focus-diagnostic-journeys.json
          retention-days: 14
          if-no-files-found: warn
