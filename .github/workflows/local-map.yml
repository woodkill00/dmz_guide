name: Local map workspace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-map:
    name: local-map (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run map:install
      - run: npm --prefix tools/hajin-map exec playwright install --with-deps chromium
      - run: npm run map:test
      - run: npm run map:build
      - run: npm run map:test:browser
      - run: npm run map:test:capacity
      - name: Retain synthetic workspace evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-map-synthetic-${{ matrix.node }}
          path: tools/hajin-map/.local/browser-checks/
          include-hidden-files: true
          if-no-files-found: warn
