name: Repository quality
on:
  push:
    branches: [main, '002-repository-bootstrap']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-checks:
    name: repository-checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check repository contracts and provenance
        run: python scripts/check.py
      - name: Run positive and negative tests
        run: python -m unittest discover -s tests -v
      - name: Select feature and smoke-test upstream scripts
        shell: bash
        run: |
          python scripts/select-feature.py 002-repository-bootstrap
          for script in .specify/scripts/bash/*.sh; do bash -n "$script"; done
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
