name: Repository quality
on:
  push:
    branches: [main, "002-repository-bootstrap"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-checks:
    name: repository-checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Check repository contracts and provenance
        run: python scripts/check.py
      - name: Run positive and negative tests
        run: python -m unittest discover -s tests -v
      - name: Select feature and smoke-test upstream scripts
        shell: bash
        run: |
          python scripts/select-feature.py 002-repository-bootstrap
          for script in .specify/scripts/bash/*.sh; do bash -n "$script"; done
          bash .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          for feature in 003-runnable-guide 004-shared-planning 005-portable-editor 006-location-intelligence 007-progression-guides 008-community-release 009-repository-content-studio 010-page-edit-actions 011-private-draft-safety 012-recovery-truthfulness 013-build-reliability 014-reader-flow 015-contributor-workflows 016-accessible-release-evidence 017-measured-reader-scale 018-deterministic-release; do
            SPECIFY_FEATURE_DIRECTORY="specs/$feature" bash .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks --include-tasks
          done

  runtime-core:
    name: runtime-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - name: Report selected Node
        run: node --version
      - run: npm ci --ignore-scripts
      - run: npm run map:install
      - run: npm run skills:check
      - run: npm run format:check
      - run: npm run build
      - run: npm run ui:audit
      - run: npm test
      - name: Verify packaging guards with the actual runtime Python
        run: python -m unittest discover -s tests -p test_package_diagnostics.py -v
      - name: Rebuild and verify clean distributable
        run: npm run package && python scripts/verify-release.py
      - name: Save clean static release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: static-release-${{ matrix.os }}
          path: release/dmz-guide-static.zip
          retention-days: 14

  browser-acceptance:
    name: browser-acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run map:install
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/browser/measured-scale-runner.mjs
      - run: node tests/browser/contributor-workflows.mjs
      - run: npm run test:browser
      - run: node tests/browser/reliability.mjs
      - name: Save compact upgrade inventory ${{ matrix.os }} evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-evidence-${{ matrix.os }}-inventory
          path: |
            test-results/upgrade023-independent/*chromium*.json
            test-results/upgrade023-independent/*chromium*-inventory-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Save compact upgrade progression ${{ matrix.os }} evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-evidence-${{ matrix.os }}-progression
          path: |
            test-results/upgrade023-independent/*chromium*.json
            test-results/upgrade023-independent/*chromium*-progression-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Save compact upgrade other ${{ matrix.os }} evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-evidence-${{ matrix.os }}-other
          path: |
            test-results/upgrade023-independent/*chromium*.json
            test-results/upgrade023-independent/*chromium*.png
            !test-results/upgrade023-independent/*chromium*-inventory-*.png
            !test-results/upgrade023-independent/*chromium*-progression-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Save compact recorded spending evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-spending-${{ matrix.os }}
          path: |
            test-results/upgrade023-spending/
          retention-days: 14
          if-no-files-found: warn
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.os }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  studio-acceptance:
    name: studio-acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run map:install
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:studio
      - name: Save Studio evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: studio-evidence-${{ matrix.os }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  # Retain the existing required-check names; a skipped/failed suite is never green.
  runtime-checks:
    name: runtime-checks (${{ matrix.os }})
    if: ${{ always() }}
    needs: [runtime-core, browser-acceptance, studio-acceptance]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: node scripts/ci-suite-gate.mjs
        env:
          DMZ_SUITE_RESULTS: ${{ toJSON(needs) }}

  runtime-compatibility:
    name: runtime-compatibility (Ubuntu, Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          package-manager-cache: false
      - run: node --version
      - run: npm ci --ignore-scripts
      - run: npm run map:install
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run package && python scripts/verify-release.py

  page-editor:
    name: Dynamic page editor (three browser engines)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run map:install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/browser/page-editor-run.mjs
      - run: node tests/browser/capture-settlement.mjs
      - run: node tests/browser/page-editor-experience.mjs
      - run: node tests/browser/page-editor-experience-adverse.mjs
      - run: npm run build
      - run: node tests/browser/optional-artwork.mjs
      - run: node tests/browser/health-failures.mjs
      - run: npm run test:cards
      - run: node tests/browser/mission-chapter-links.mjs
      - run: node tests/browser/mission-objectives.mjs
      - run: node tests/browser/all-page-edit-links.mjs
      - name: Save page editor and card visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: page-editor-094-evidence
          path: |
            test-results/page-editor-*.png
            test-results/card-reflow/
          retention-days: 14
          if-no-files-found: warn

  browser-engines:
    name: Firefox and WebKit smoke (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps firefox webkit
        timeout-minutes: 25
      - run: node tests/browser/measured-scale-runner.mjs --engines
      - run: node tests/browser/contributor-workflows.mjs --engines
      - run: npm run test:engines
      - run: npm run test:studio -- --engines
      - name: Save compact upgrade inventory firefox evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-evidence-firefox-inventory
          path: |
            test-results/upgrade023-independent/*firefox*.json
            test-results/upgrade023-independent/*firefox*-inventory-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Save compact upgrade progression firefox evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-evidence-firefox-progression
          path: |
            test-results/upgrade023-independent/*firefox*.json
            test-results/upgrade023-independent/*firefox*-progression-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Save compact upgrade other firefox evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-evidence-firefox-other
          path: |
            test-results/upgrade023-independent/*firefox*.json
            test-results/upgrade023-independent/*firefox*.png
            !test-results/upgrade023-independent/*firefox*-inventory-*.png
            !test-results/upgrade023-independent/*firefox*-progression-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Save compact upgrade webkit acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-evidence-webkit
          path: test-results/upgrade023-independent/*webkit*
          retention-days: 14
          if-no-files-found: warn
      - name: Save compact recorded spending firefox evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-spending-firefox
          path: |
            test-results/upgrade023-spending/*firefox*
          retention-days: 14
          if-no-files-found: warn
      - name: Save compact recorded spending webkit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade023-spending-webkit
          path: |
            test-results/upgrade023-spending/*webkit*
          retention-days: 14
          if-no-files-found: warn
      - name: Save engine evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-evidence-engines-ubuntu
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
